<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-label="Max van der Wolf">
    <style>
        .disc {
            fill: #ffffff;
        }
        @media (prefers-color-scheme: light) {
            .disc {
                fill: #121212;
            }
        }
    </style>
    <defs>
        <mask id="mark">
            <circle cx="232" cy="232" r="191" fill="#ffffff" />
            <g fill="#000000">
                <rect x="150" y="150" width="32" height="310" rx="15" />
                <rect x="215" y="150" width="32" height="165" rx="15" />
                <rect x="283" y="0" width="32" height="309" rx="15" />
            </g>
        </mask>
    </defs>
    <circle cx="232" cy="232" r="191" class="disc" mask="url(#mark)" />
</svg>
